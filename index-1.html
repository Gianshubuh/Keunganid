<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catatan Keuangan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.container{max-width:760px;margin:auto;padding:18px}.header{background:#111827;color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
h1{margin:0 0 5px;font-size:25px}.muted{color:#9ca3af;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0000000d}
.card small{display:block;color:#6b7280}.card b{display:block;margin-top:7px;font-size:16px}
.income{color:#15803d}.expense{color:#dc2626}.balance{color:#2563eb}
.panel{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
button{border:0;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}
.transaction{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.transaction:last-child{border-bottom:0}
.tx-title{font-weight:bold}.tx-meta{font-size:12px;color:#6b7280;margin-top:4px}.delete{width:auto;padding:7px 10px;background:#fee2e2;color:#b91c1c}
.empty{text-align:center;color:#6b7280;padding:25px 5px}
@media(max-width:560px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💰 Catatan Keuangan</h1>
    <div class="muted">Pencatatan pemasukan & pengeluaran sederhana</div>
  </div>

  <div class="cards">
    <div class="card"><small>Pemasukan</small><b class="income" id="income">Rp0</b></div>
    <div class="card"><small>Pengeluaran</small><b class="expense" id="expense">Rp0</b></div>
    <div class="card"><small>Saldo</small><b class="balance" id="balance">Rp0</b></div>
  </div>

  <div class="panel">
    <h3>Tambah Transaksi</h3>
    <div class="grid">
      <select id="type">
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>
      <input id="date" type="date">
      <input id="amount" type="number" min="0" placeholder="Nominal (Rp)">
      <input id="category" placeholder="Kategori, contoh: Makan">
      <input id="note" class="full" placeholder="Keterangan">
      <button class="full" onclick="addTransaction()">+ Simpan Transaksi</button>
    </div>
  </div>

  <div class="panel">
    <div class="grid">
      <input id="search" class="full" placeholder="🔎 Cari transaksi..." oninput="render()">
      <select id="filter" onchange="render()">
        <option value="all">Semua</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>
      <button class="secondary" onclick="exportData()">Backup Data</button>
    </div>
  </div>

  <div class="panel">
    <h3>Riwayat Transaksi</h3>
    <div id="list"></div>
  </div>
</div>

<script>
const KEY="catatan-keuangan-v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function rupiah(n){return "Rp"+Number(n).toLocaleString("id-ID")}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function addTransaction(){
  const type=document.getElementById("type").value;
  const amount=Number(document.getElementById("amount").value);
  const category=document.getElementById("category").value.trim()||"Lainnya";
  const note=document.getElementById("note").value.trim();
  const date=document.getElementById("date").value;
  if(!amount||amount<1||!date){alert("Isi tanggal dan nominal terlebih dahulu.");return}
  data.unshift({id:Date.now(),type,amount,category,note,date});
  save();
  document.getElementById("amount").value="";
  document.getElementById("note").value="";
  render();
}
function removeTx(id){
  if(confirm("Hapus transaksi ini?")){
    data=data.filter(x=>x.id!==id);save();render();
  }
}
function render(){
  let income=0,expense=0;
  data.forEach(x=>x.type==="income"?income+=x.amount:expense+=x.amount);
  document.getElementById("income").textContent=rupiah(income);
  document.getElementById("expense").textContent=rupiah(expense);
  document.getElementById("balance").textContent=rupiah(income-expense);

  const q=document.getElementById("search").value.toLowerCase();
  const f=document.getElementById("filter").value;
  const filtered=data.filter(x=>
    (f==="all"||x.type===f) &&
    (x.category.toLowerCase().includes(q)||x.note.toLowerCase().includes(q))
  );
  const list=document.getElementById("list");
  if(!filtered.length){list.innerHTML='<div class="empty">Belum ada transaksi.</div>';return}
  list.innerHTML=filtered.map(x=>`
    <div class="transaction">
      <div>
        <div class="tx-title">${escapeHtml(x.category)}</div>
        <div class="tx-meta">${x.date} • ${escapeHtml(x.note||"-")}</div>
      </div>
      <div style="text-align:right">
        <div class="${x.type==="income"?"income":"expense"}">${x.type==="income"?"+":"-"} ${rupiah(x.amount)}</div>
        <button class="delete" onclick="removeTx(${x.id})">Hapus</button>
      </div>
    </div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-keuangan.json";a.click();
}
render();
</script>
</body>
</html>
