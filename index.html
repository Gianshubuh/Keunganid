<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Cash & Non Cash</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:sans-serif}
  body{background:#111;color:#fff;margin:0;padding:16px}
  .card{background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:14px;margin-bottom:12px}
  .label{color:#aaa;font-size:13px}
  .green{color:#4ade80;font-size:22px;font-weight:bold}
  .red{color:#f87171;font-size:22px;font-weight:bold}
  .blue{color:#60a5fa;font-size:22px;font-weight:bold}
  .row{display:flex;gap:12px}.row .card{flex:1}
  .small{font-size:11px;color:#888}
  input,select{width:100%;background:#2a2a2a;border:1px solid #444;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px;font-size:16px;outline:none}
  button{width:100%;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
  .btn-blue{background:#1d4ed8;color:#fff}
  .btn-green{background:#15803d;color:#fff}
  .item{background:#1e1e1e;border:1px solid #333;padding:10px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between}
  .badge{font-size:11px;padding:3px 8px;border-radius:20px}
  .cash{background:#14532d;color:#86efac}
  .noncash{background:#1e3a8a;color:#93c5fd}
  .hapus{background:#dc2626;padding:5px 10px;border-radius:8px;font-size:12px;width:auto;border:none;color:#fff}
</style>
</head>
<body>

<h2>Keuangan - November 2026</h2>

<div class="row">
  <div class="card"><div class="label">Pemasukan - Cash</div><div class="green" id="inCash">Rp 0</div></div>
  <div class="card"><div class="label">Pemasukan - Non Cash</div><div class="green" id="inNon">Rp 0</div></div>
</div>
<div class="row">
  <div class="card"><div class="label">Pengeluaran - Cash</div><div class="red" id="outCash">Rp 0</div></div>
  <div class="card"><div class="label">Pengeluaran - Non Cash</div><div class="red" id="outNon">Rp 0</div></div>
</div>
<div class="card"><div class="label">Saldo / Sisa Uang - November 2026</div><div class="blue" id="saldoTotal">Rp 0</div></div>

<div class="card">
  <h3>Tambah Transaksi</h3>
  <select id="jenis"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select>
  <label class="small">Metode Pembayaran:</label>
  <select id="metode" onchange="cekNonCash()"><option value="Cash">Cash / Tunai</option><option value="Non Cash">Non Cash</option></select>
  <div id="detailNonCash" style="display:none">
    <select id="detail"><option>Transfer Bank</option><option>QRIS</option><option>E-Wallet (DANA / GoPay / OVO)</option><option>Kartu Debit / Kredit</option></select>
  </div>
  <input type="date" id="tanggal" value="2026-11-07">
  <label class="small">Nominal (Rp): Ketik 500000 otomatis jadi 500.000</label>
  <input type="text" id="nominal" inputmode="numeric" placeholder="Contoh: 50.000" autocomplete="off">
  <input type="text" id="kategori" placeholder="Kategori, contoh: Makan">
  <input type="text" id="ket" placeholder="Keterangan">
  <button class="btn-blue" onclick="simpan()">+ Simpan Transaksi</button>
</div>

<h3>Riwayat Transaksi</h3>
<div id="list"></div>

<!-- EXPORT EXCEL CUMA DI BAWAH SAJA -->
<div style="margin-top:16px;margin-bottom:30px">
  <button class="btn-green" onclick="exportExcelAsli()">📥 EXPORT KE EXCEL (.xlsx) - Buka di APK Excel</button>
  <div class="small" style="text-align:center;margin-top:8px">File akan terdownload, klik file-nya -> Buka dengan Excel</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('keuangan_cash_noncash') || '[]');
function fmt(n){ return 'Rp ' + n.toLocaleString('id-ID'); }

// FORMAT RUPIAH OTOMATIS: 500000 -> 500.000
let inputNominal = document.getElementById('nominal');
inputNominal.addEventListener('input', function(){
  let angkaBersih = this.value.replace(/[^0-9]/g,'');
  if(!angkaBersih){ this.value=''; return; }
  let baru = parseInt(angkaBersih).toLocaleString('id-ID');
  this.value = baru;
  this.setSelectionRange(baru.length, baru.length);
});
function getNominal(){ return parseInt(document.getElementById('nominal').value.replace(/[^0-9]/g,'')) || 0; }

function cekNonCash(){ document.getElementById('detailNonCash').style.display = document.getElementById('metode').value=='Non Cash' ? 'block' : 'none'; }
function render(){
  let ic=0, inn=0, oc=0, on=0;
  data.forEach(t=>{
    if(t.jenis=='Pemasukan' && t.metode=='Cash') ic+=t.nominal;
    if(t.jenis=='Pemasukan' && t.metode=='Non Cash') inn+=t.nominal;
    if(t.jenis=='Pengeluaran' && t.metode=='Cash') oc+=t.nominal;
    if(t.jenis=='Pengeluaran' && t.metode=='Non Cash') on+=t.nominal;
  });
  document.getElementById('inCash').innerText=fmt(ic);
  document.getElementById('inNon').innerText=fmt(inn);
  document.getElementById('outCash').innerText=fmt(oc);
  document.getElementById('outNon').innerText=fmt(on);
  document.getElementById('saldoTotal').innerText=fmt((ic+inn)-(oc+on));
  let html='';
  data.slice().reverse().forEach((t,i)=>{
    let idx=data.length-1-i;
    let warna=t.jenis=='Pemasukan'?'#4ade80':'#f87171';
    let tanda=t.jenis=='Pemasukan'?'+':'-';
    html+=`<div class="item"><div><b>${t.kategori}</b> <span class="badge ${t.metode=='Cash'?'cash':'noncash'}">${t.metode} ${t.detail?'- '+t.detail:''}</span><br><span class="small">${t.tanggal} - ${t.ket} - ${t.jenis}</span></div><div style="text-align:right"><b style="color:${warna}">${tanda} ${fmt(t.nominal)}</b><br><button class="hapus" onclick="hapus(${idx})">Hapus</button></div></div>`;
  });
  document.getElementById('list').innerHTML=html||'<p style="color:#888">Belum ada transaksi</p>';
}
function simpan(){
  let jenis=document.getElementById('jenis').value;
  let metode=document.getElementById('metode').value;
  let detail=metode=='Non Cash'?document.getElementById('detail').value:'';
  let tanggal=document.getElementById('tanggal').value;
  let nominal=getNominal();
  let kategori=document.getElementById('kategori').value||'Lainnya';
  let ket=document.getElementById('ket').value||'';
  if(!nominal){alert('Isi nominal dulu Ayah!');return;}
  data.push({jenis,metode,detail,tanggal,nominal,kategori,ket});
  localStorage.setItem('keuangan_cash_noncash',JSON.stringify(data));
  document.getElementById('nominal').value='';document.getElementById('kategori').value='';document.getElementById('ket').value='';
  render();
}
function hapus(i){ if(confirm('Hapus?')){data.splice(i,1);localStorage.setItem('keuangan_cash_noncash',JSON.stringify(data));render();} }

// EXPORT EXCEL ASLI .xlsx - BISA DIBUKA DI APK EXCEL
function exportExcelAsli(){
  if(data.length==0){ alert('Belum ada transaksi, isi dulu Ayah!'); return; }
  let ic=0, inn=0, oc=0, on=0;
  data.forEach(t=>{
    if(t.jenis=='Pemasukan' && t.metode=='Cash') ic+=t.nominal;
    if(t.jenis=='Pemasukan' && t.metode=='Non Cash') inn+=t.nominal;
    if(t.jenis=='Pengeluaran' && t.metode=='Cash') oc+=t.nominal;
    if(t.jenis=='Pengeluaran' && t.metode=='Non Cash') on+=t.nominal;
  });
  let rekap = [
    ['LAPORAN KEUANGAN - NOVEMBER 2026'],[''],
    ['Pemasukan Cash', ic],
    ['Pemasukan Non Cash', inn],
    ['Total Pemasukan', ic+inn],[''],
    ['Pengeluaran Cash', oc],
    ['Pengeluaran Non Cash', on],
    ['Total Pengeluaran', oc+on],[''],
    ['Saldo Cash', ic-oc],
    ['Saldo Non Cash', inn-on],
    ['Saldo Total', (ic+inn)-(oc+on)],
  ];
  let detail = [['Tanggal','Jenis','Metode','Detail Non Cash','Kategori','Keterangan','Nominal (Rp)']];
  data.forEach(t=>{ detail.push([t.tanggal, t.jenis, t.metode, t.detail||'', t.kategori, t.ket, t.nominal]); });
  let wb = XLSX.utils.book_new();
  let ws1 = XLSX.utils.aoa_to_sheet(rekap);
  let ws2 = XLSX.utils.aoa_to_sheet(detail);
  ws1['!cols']=[{wch:25},{wch:20}];
  ws2['!cols']=[{wch:12},{wch:12},{wch:12},{wch:20},{wch:15},{wch:20},{wch:15}];
  XLSX.utils.book_append_sheet(wb, ws1, "Rekap");
  XLSX.utils.book_append_sheet(wb, ws2, "Transaksi");
  XLSX.writeFile(wb, "Laporan_Keuangan_November_2026.xlsx");
  alert('Berhasil! File Laporan_Keuangan_November_2026.xlsx terdownload. Buka di APK Excel ya Ayah.');
}
render();
</script>
</body>
</html>
